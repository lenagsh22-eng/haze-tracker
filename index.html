<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; background: #e8f4ff;
           font-family: system-ui, sans-serif; }
    h1 { color: #2d5a3d; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg width="260" height="320" viewBox="0 0 260 320" xmlns="http://www.w3.org/2000/svg" aria-label="A sunflower">
    <!-- stem -->
    <path d="M130 170 C124 220 136 270 130 315" stroke="#3a8f4f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M132 255 C175 232 205 242 215 265 C180 276 152 272 132 255 Z" fill="#4caf63"/>
    <path d="M128 225 C85 202 55 212 45 235 C80 246 108 242 128 225 Z" fill="#4caf63"/>
    <g transform="translate(130 110)">
      <!-- back petals -->
      <g fill="#f5a800">
        <ellipse rx="13" ry="38" cy="-62"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(30)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(60)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(90)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(120)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(150)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(180)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(210)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(240)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(270)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(300)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(330)"/>
      </g>
      <!-- front petals -->
      <g fill="#ffd21f">
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(15)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(45)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(75)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(105)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(135)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(165)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(195)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(225)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(255)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(285)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(315)"/>
        <ellipse rx="13" ry="38" cy="-62" transform="rotate(345)"/>
      </g>
      <!-- center -->
      <circle r="42" fill="#6b3f1d"/>
      <circle r="42" fill="none" stroke="#4a2a10" stroke-width="4"/>
      <circle r="26" fill="#4a2a10" opacity="0.55"/>
      <g fill="#2e1808">
        <circle cx="0" cy="0" r="3"/>
        <circle cx="12" cy="0" r="3"/><circle cx="-12" cy="0" r="3"/>
        <circle cx="0" cy="12" r="3"/><circle cx="0" cy="-12" r="3"/>
        <circle cx="8.5" cy="8.5" r="3"/><circle cx="-8.5" cy="8.5" r="3"/>
        <circle cx="8.5" cy="-8.5" r="3"/><circle cx="-8.5" cy="-8.5" r="3"/>
        <circle cx="24" cy="0" r="3"/><circle cx="-24" cy="0" r="3"/>
        <circle cx="0" cy="24" r="3"/><circle cx="0" cy="-24" r="3"/>
        <circle cx="17" cy="17" r="3"/><circle cx="-17" cy="17" r="3"/>
        <circle cx="17" cy="-17" r="3"/><circle cx="-17" cy="-17" r="3"/>
        <circle cx="30" cy="12" r="3"/><circle cx="-30" cy="12" r="3"/>
        <circle cx="30" cy="-12" r="3"/><circle cx="-30" cy="-12" r="3"/>
        <circle cx="12" cy="30" r="3"/><circle cx="-12" cy="30" r="3"/>
        <circle cx="12" cy="-30" r="3"/><circle cx="-12" cy="-30" r="3"/>
      </g>
    </g>
  </svg>
</body>
</html>
