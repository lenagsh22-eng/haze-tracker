<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; background: #fff6e8;
           font-family: system-ui, sans-serif; }
    h1 { color: #2d5a3d; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg width="240" height="300" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" aria-label="A violet flower">
    <!-- stem -->
    <path d="M120 150 C115 200 125 250 120 295" stroke="#3a8f4f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M122 235 C160 215 185 225 195 245 C165 255 140 250 122 235 Z" fill="#4caf63"/>
    <path d="M118 205 C80 185 55 195 45 215 C75 225 100 220 118 205 Z" fill="#4caf63"/>
    <!-- petals -->
    <g transform="translate(120 100)" fill="#9b7bea">
      <ellipse rx="22" ry="45" cy="-45"/>
      <ellipse rx="22" ry="45" cy="-45" transform="rotate(60)"/>
      <ellipse rx="22" ry="45" cy="-45" transform="rotate(120)"/>
      <ellipse rx="22" ry="45" cy="-45" transform="rotate(180)"/>
      <ellipse rx="22" ry="45" cy="-45" transform="rotate(240)"/>
      <ellipse rx="22" ry="45" cy="-45" transform="rotate(300)"/>
    </g>
    <!-- center -->
    <circle cx="120" cy="100" r="22" fill="#ffd54a"/>
    <circle cx="120" cy="100" r="22" fill="none" stroke="#f0a800" stroke-width="3"/>
  </svg>
</body>
</html>
