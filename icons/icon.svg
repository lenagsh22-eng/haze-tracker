<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13243b"/>
      <stop offset="1" stop-color="#4a6580"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe28f"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb55c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb55c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- glow and sun -->
  <circle cx="256" cy="214" r="170" fill="url(#glow)"/>
  <circle cx="256" cy="214" r="104" fill="url(#sun)"/>
  <!-- haze bands drifting across the sun -->
  <rect x="96"  y="228" width="300" height="26" rx="13" fill="#f6efe4" opacity="0.50"/>
  <rect x="84"  y="274" width="300" height="26" rx="13" fill="#f6efe4" opacity="0.72"/>
  <rect x="128" y="320" width="300" height="26" rx="13" fill="#f6efe4" opacity="0.92"/>
</svg>
